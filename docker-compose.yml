services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cx_reviews
      POSTGRES_USER: cx
      POSTGRES_PASSWORD: cx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cx -d cx_reviews"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cx:cx@postgres:5432/cx_reviews
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://cx:cx@postgres:5432/cx_reviews
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.workers.runner"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000/api/v1
      APP_API_KEY: ${APP_API_KEY}
      DEFAULT_ORGANIZATION_ID: ${DEFAULT_ORGANIZATION_ID:-}
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
